[pytest]
markers =
    cb: code-based (white-box) tests
    tb: technique/tool-based tests (boundary, equivalence, parametrized)
    ob: observation-based (user workflow) tests
    unit: pure logic/unit tests (no HTTP, no DB)
    system: end-to-end workflows across multiple requests/roles
    reviews: tests for the reviews feature
    wishlist: tests for the wishlist feature
    dashboard: tests for the admin dashboard feature
    integration: HTTP route and app integration tests
